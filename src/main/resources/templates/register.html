<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun - CampusShare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .register-card { width: 100%; max-width: 450px; padding: 2rem; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); background: white; }
    </style>
</head>
<body>

<div class="register-card">
    <div class="text-center mb-4">
        <img src="/images/logoCS.png" alt="Logo" height="60">
        <h4 class="mt-2 fw-bold">Gabung CampusShare</h4>
        <p class="text-muted small">Bagikan catatan dan Belajar bersama.</p>
    </div>
    <div id="alertMessage" class="alert alert-danger d-none"></div>
    <div id="successMessage" class="alert alert-success d-none">
        Registrasi berhasil! Mengalihkan ke login...
    </div>

    <form id="registerForm">
        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" id="username" class="form-control" placeholder="Contoh: Fauzi Octa" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Email Kampus</label>
            <input type="email" id="email" class="form-control" placeholder="nama@kampus.ac.id" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" id="password" class="form-control" placeholder="Minimal 6 karakter" required>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Daftar Sekarang</button>
    </form>

    <div class="text-center mt-4 border-top pt-3">
        <p class="small text-muted">Sudah punya akun?</p>
        <a href="/login" class="btn btn-outline-secondary btn-sm w-100">Masuk Disini</a>
    </div>
</div>
<!--JavaScript-->
<script>
    const registerForm = document.getElementById('registerForm');
    const alertBox = document.getElementById('alertMessage');
    const successBox = document.getElementById('successMessage');

    registerForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        // 1. Ambil data input
        const username = document.getElementById('username').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        // Reset pesan
        alertBox.classList.add('d-none');
        successBox.classList.add('d-none');

        try {
            // 2. Kirim ke API Backend
            const response = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: username,
                    email: email,
                    password: password
                })
            });

            // 3. Cek Hasil
            if (response.ok) {
                // SUKSES
                successBox.classList.remove('d-none');
                registerForm.reset(); // Kosongkan form

                // Tunggu 2 detik lalu pindah ke halaman Login otomatis
                setTimeout(() => {
                    window.location.href = '/login';
                }, 2000);
            } else {
                // GAGAL (Misal: Email sudah ada)
                const errorText = await response.text();
                alertBox.textContent = "Gagal: " + errorText;
                alertBox.classList.remove('d-none');
            }
        } catch (error) {
            alertBox.textContent = "Terjadi kesalahan koneksi ke server.";
            alertBox.classList.remove('d-none');
        }
    });
</script>
</body>
</html>
